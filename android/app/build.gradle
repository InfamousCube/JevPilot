apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// Release signing lives outside the repo: %APPDATA%\JevPilot\android-release.properties
// (storeFile, storePassword, keyAlias, keyPassword). Without it only debug builds are signed.
def signingProps = new File(System.getenv("APPDATA") ?: "", "JevPilot/android-release.properties")

android {
    namespace "com.leo.jevpilot"
    compileSdk 36

    defaultConfig {
        applicationId "com.leo.jevpilot"
        minSdk 30
        targetSdk 36
        versionCode 3
        versionName "1.1.0"
    }
    signingConfigs {
        if (signingProps.exists()) {
            release {
                def p = new Properties()
                signingProps.withInputStream { p.load(it) }
                storeFile new File(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingProps.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}
